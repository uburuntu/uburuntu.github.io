name: Deploy Jekyll to GitHub Pages

on:
  push:
    branches: [master]
  schedule:
    - cron: "0 0 1 * *"  # 1st of every month — keeps auto-computed dates fresh
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Install Typst
        uses: typst-community/setup-typst@v5

      - name: Compile CV
        run: |
          typst compile --font-path cv/fonts cv/main.typ Bekbulatov-Ramzan-CV.pdf
          typst compile --font-path cv/fonts cv/main.typ images/cv-preview.png --format png --ppi 150 --pages 1
          typst compile --font-path cv/fonts cv/main.typ "images/cv-page-{p}.png" --format png --ppi 200
          cp Bekbulatov-Ramzan-CV.pdf cv.pdf
          mkdir -p _data
          echo "last_modified: \"$(git log -1 --format='%cd' --date=format:'%B %Y' -- cv/main.typ)\"" > _data/cv.yml
          echo "pages: $(ls -1 images/cv-page-*.png | wc -l | tr -d ' ')" >> _data/cv.yml

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Build Jekyll site
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - uses: actions/upload-pages-artifact@v4

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
