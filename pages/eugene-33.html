          transform: translateY(-1px) rotate(-1deg) scale(1);

      .cake-container {

      .cake-container.dancing .flame {

      @keyframes wildFlicker {
        0% {

        50% {
          transform: scale(1.3) rotate(10deg) translateX(-2px);
        }
        100% {
          transform: scale(1) rotate(-5deg) translateX(0);
        }
      }

      @keyframes cakeDance {
        0% {
          transform: rotate(0deg) scale(1);
        }
        10% {
          transform: rotate(-10deg) scale(1.1) translateX(-10px);
        }
        20% {
          transform: rotate(10deg) scale(0.9) translateX(10px);
        }
        30% {
          transform: rotate(-15deg) scale(1.2) translateY(-20px);
        }
        40% {
          transform: rotate(15deg) scale(0.8) translateY(10px);
        }
        50% {

      .cake {

        }

      .balloon {
        position: absolute;

        transition: transform 0.2s ease;
      }

      .balloon:hover {
        transform: scale(1.1);
      }

      .balloon-string {
        position: absolute;
        width: 1px;
        height: 100px;
        background: rgba(0, 0, 0, 0.2);

      .music-control {

        padding: 10px 20px;
        border-radius: 25px;

      .refresh-wishes {
        background: rgba(255, 255, 255, 0.3);
        border: none;

        background: rgba(255, 255, 255, 0.4);
        transform: scale(1.05);
      }

      .refresh-wishes:active {
        transform: scale(0.95);
      }
    </style>

    <script>

      // - "AudioContext prevented from starting" is expected - browsers require user interaction for audio

      // Birthday wishes array

        "Here's to the guy who can debug code AND roll perfect character stats! 🎲",
        "May Anastasia and Zephyr spoil you rotten today! You deserve it! 🎁",
        "Happy 33rd Birthday! Thanks for being such a wonderful friend! 🙏",

        "Here's to another year of inside jokes and shared memories! 😊",

      ];

      // Color themes
      const themes = [
        "theme-sunset",
        "theme-ocean",
        "theme-forest",
        "theme-candy",
        "theme-cosmic",
      ];
      document.body.className =
        themes[Math.floor(Math.random() * themes.length)];

      // Cake dance on click
      const cakeContainer = document.querySelector(".cake-container");
      cakeContainer.addEventListener("click", () => {
        cakeContainer.classList.remove("dancing");
        // Force reflow to restart animation
        void cakeContainer.offsetWidth;
        cakeContainer.classList.add("dancing");

        // Remove class after animation
        setTimeout(() => {
          cakeContainer.classList.remove("dancing");
        }, 1000);

        // Create mini cake emojis explosion
        for (let i = 0; i < 8; i++) {
          const emoji = document.createElement("div");
          emoji.className = "floating-emoji";
          emoji.textContent = "🍰";
          emoji.style.left = cakeContainer.offsetLeft + 125 + "px";
          emoji.style.top = cakeContainer.offsetTop + 100 + "px";
          emoji.style.fontSize = "1.5em";

          // Random direction
          const angle = (Math.PI * 2 * i) / 8;
          const velocity = 100 + Math.random() * 100;
          emoji.style.setProperty("--tx", Math.cos(angle) * velocity + "px");
          emoji.style.setProperty("--ty", Math.sin(angle) * velocity + "px");
          emoji.style.animation = "explodeCake 1s ease-out forwards";

          document.body.appendChild(emoji);
          setTimeout(() => emoji.remove(), 1000);
        }

        // Play a fun sound if audio is available
        if (window.audioContext && audioContext.state === "running") {
          // Play a little melody
          const notes = [523, 659, 784, 1047]; // C, E, G, C (higher)
          notes.forEach((freq, i) => {
            setTimeout(() => {
              const osc = audioContext.createOscillator();
              const gain = audioContext.createGain();
              osc.connect(gain);
              gain.connect(audioContext.destination);

              osc.frequency.value = freq;
              osc.type = "sine";
              gain.gain.setValueAtTime(0.1, audioContext.currentTime);
              gain.gain.exponentialRampToValueAtTime(
                0.01,
                audioContext.currentTime + 0.2,
              );

              osc.start(audioContext.currentTime);
              osc.stop(audioContext.currentTime + 0.2);
            }, i * 50);
          });
        }
      });

      // Birthday emojis
      const birthdayEmojis = [
        "🎂",
        "🎉",
        "🎊",
        "🎈",
        "🎁",
        "🎯",
        "🎲",
        "⭐",
        "🌟",
        "💫",
      ];
      const celebrationEmojis = [
        "🎉",
        "🎊",
        "🎈",
        "🎆",
        "🎇",
        "✨",
        "🎀",
        "🎁",
        "🥳",
        "🎂",
      ];

      // Set random emojis in title
      document.querySelector(".emoji-left").textContent =
        celebrationEmojis[Math.floor(Math.random() * celebrationEmojis.length)];
      document.querySelector(".emoji-right").textContent =
        celebrationEmojis[Math.floor(Math.random() * celebrationEmojis.length)];

      // Confetti setup
      const confettiCanvas = document.getElementById("confetti-canvas");
      const confettiCtx = confettiCanvas.getContext("2d");
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;

      const confettiPieces = [];
      const confettiCount = 300;
      const colors = [
        "#ff0000",
        "#00ff00",
        "#0000ff",
        "#ffff00",
        "#ff00ff",
        "#00ffff",
        "#ffa500",
        "#ff69b4",
      ];

      // Device orientation for tilt control
      let tiltX = 0;
      let tiltY = 0;

      class Confetti {
        constructor() {
          this.x = Math.random() * confettiCanvas.width;
          this.y =
            Math.random() * confettiCanvas.height - confettiCanvas.height;
          this.w = Math.random() * 10 + 5;
          this.h = Math.random() * 5 + 3;
          this.color = colors[Math.floor(Math.random() * colors.length)];
          this.speed = Math.random() * 3 + 2;
          this.velX = Math.random() * 2 - 1;
          this.angle = Math.random() * 360;
          this.angleSpeed = Math.random() * 0.2 - 0.1;
        }

        update() {
          this.y += this.speed;
          this.x += this.velX + tiltX * 0.5;
          this.y += tiltY * 0.2;
          this.angle += this.angleSpeed;

          if (this.y > confettiCanvas.height) {
            this.y = -20;
            this.x = Math.random() * confettiCanvas.width;
          }

          if (this.x > confettiCanvas.width) this.x = 0;
          if (this.x < 0) this.x = confettiCanvas.width;
        }

        draw() {
          confettiCtx.save();
          confettiCtx.translate(this.x + this.w / 2, this.y + this.h / 2);
          confettiCtx.rotate(this.angle);
          confettiCtx.fillStyle = this.color;
          confettiCtx.fillRect(-this.w / 2, -this.h / 2, this.w, this.h);
          confettiCtx.restore();
        }
      }

      // Initialize confetti
      for (let i = 0; i < confettiCount; i++) {
        confettiPieces.push(new Confetti());
      }

      // Countdown timer
      function updateCountdown() {
        const birthDate = new Date("1992-08-02T00:00:00");
        const now = new Date();
        const diff = now - birthDate;

        const years = Math.floor(diff / (365.25 * 24 * 60 * 60 * 1000));
        const days = Math.floor(
          (diff % (365.25 * 24 * 60 * 60 * 1000)) / (24 * 60 * 60 * 1000),
        );
        const hours = Math.floor(
          (diff % (24 * 60 * 60 * 1000)) / (60 * 60 * 1000),
        );
        const minutes = Math.floor((diff % (60 * 60 * 1000)) / (60 * 1000));
        const seconds = Math.floor((diff % (60 * 1000)) / 1000);

        document.getElementById("countdown").innerHTML =
          `${years} years, ${days} days, ${hours} hours, ${minutes} minutes, and ${seconds} seconds`;
      }

      setInterval(updateCountdown, 1000);
      updateCountdown();

      // Display random wishes
      function displayRandomWishes() {
        const container = document.getElementById("wishes-list");
        container.innerHTML = "";
        const selectedWishes = [];
        const wishesCopy = [...wishes];

        for (let i = 0; i < 3; i++) {
          const randomIndex = Math.floor(Math.random() * wishesCopy.length);
          selectedWishes.push(wishesCopy[randomIndex]);
          wishesCopy.splice(randomIndex, 1);
        }

        selectedWishes.forEach((wish, index) => {
          const wishDiv = document.createElement("div");
          wishDiv.className = "wish";
          wishDiv.textContent = wish;
          wishDiv.style.animationDelay = `${index * 0.2}s`;
          container.appendChild(wishDiv);
        });
      }

      function refreshWishes() {
        displayRandomWishes();
      }

      displayRandomWishes();

      // Balloons
      const balloonCanvas = document.getElementById("balloon-canvas");
      const balloonCtx = balloonCanvas.getContext("2d");
      balloonCanvas.width = window.innerWidth;
      balloonCanvas.height = window.innerHeight;

      const balloons = [];
      const balloonColors = [
        "#ff6b6b",
        "#4ecdc4",
        "#45b7d1",
        "#f7dc6f",
        "#bb8fce",
      ];

      class Balloon {
        constructor() {
          this.x = Math.random() * balloonCanvas.width;
          this.y = balloonCanvas.height + 100;
          this.size = 30 + Math.random() * 20;
          this.color =
            balloonColors[Math.floor(Math.random() * balloonColors.length)];
          this.speed = 1 + Math.random() * 2;
          this.wobble = Math.random() * Math.PI * 2;
          this.wobbleSpeed = 0.02 + Math.random() * 0.02;
          this.popped = false;
        }

        update() {
          if (!this.popped) {
            this.y -= this.speed;
            this.wobble += this.wobbleSpeed;
            this.x += Math.sin(this.wobble) * 0.5;

            if (this.y < -100) {
              this.y = balloonCanvas.height + 100;
              this.x = Math.random() * balloonCanvas.width;
            }
          }
        }

        draw() {
          if (!this.popped) {
            // Balloon
            balloonCtx.fillStyle = this.color;
            balloonCtx.beginPath();
            balloonCtx.ellipse(
              this.x,
              this.y,
              this.size,
              this.size * 1.2,
              0,
              0,
              Math.PI * 2,
            );
            balloonCtx.fill();

            // String
            balloonCtx.strokeStyle = "rgba(0,0,0,0.2)";
            balloonCtx.lineWidth = 1;
            balloonCtx.beginPath();
            balloonCtx.moveTo(this.x, this.y + this.size * 1.2);
            balloonCtx.lineTo(
              this.x + Math.sin(this.wobble) * 10,
              this.y + this.size * 1.2 + 50,
            );
            balloonCtx.stroke();

            // Highlight
            balloonCtx.fillStyle = "rgba(255,255,255,0.3)";
            balloonCtx.beginPath();
            balloonCtx.ellipse(
              this.x - this.size * 0.3,
              this.y - this.size * 0.3,
              this.size * 0.3,
              this.size * 0.4,
              -Math.PI / 4,
              0,
              Math.PI * 2,
            );
            balloonCtx.fill();
          }
        }

        checkClick(x, y) {
          const dx = x - this.x;
          const dy = y - this.y;
          return Math.sqrt(dx * dx + dy * dy) < this.size;
        }
      }

      // Initialize balloons
      for (let i = 0; i < 4; i++) {
        setTimeout(() => {
          balloons.push(new Balloon());
        }, i * 1000);
      }

      // Balloon click handler - now on document instead of canvas
      document.addEventListener("click", (e) => {
        // Don't process balloon clicks on buttons
        if (
          e.target.closest(".music-control") ||
          e.target.closest(".refresh-wishes") ||
          e.target.closest(".cake-container") ||
          e.target.tagName === "BUTTON"
        )
          return;

        balloons.forEach((balloon) => {
          if (!balloon.popped && balloon.checkClick(e.clientX, e.clientY)) {
            balloon.popped = true;
            createBalloonPop(balloon.x, balloon.y, balloon.color);
            setTimeout(() => {
              balloons.splice(balloons.indexOf(balloon), 1);
              balloons.push(new Balloon());
            }, 500);
          }
        });
      });

      function createBalloonPop(x, y, color) {
        for (let i = 0; i < 10; i++) {
          const particle = document.createElement("div");
          particle.className = "firework-particle";
          particle.style.left = x + "px";
          particle.style.top = y + "px";
          particle.style.backgroundColor = color;

          const angle = (Math.PI * 2 * i) / 10;
          const velocity = 30 + Math.random() * 30;
          const tx = Math.cos(angle) * velocity;
          const ty = Math.sin(angle) * velocity;

          particle.style.transform = `translate(${tx}px, ${ty}px)`;
          particle.style.boxShadow = `0 0 6px ${color}`;

          document.body.appendChild(particle);
          setTimeout(() => particle.remove(), 1000);
        }
      }

      // Trail effect
      const trailCanvas = document.getElementById("trail-canvas");
      const trailCtx = trailCanvas.getContext("2d");
      trailCanvas.width = window.innerWidth;
      trailCanvas.height = window.innerHeight;

      const trail = [];
      const maxTrailLength = 20;
      let hue = 0;
      let lastTrailTime = 0;

      function updateTrail(x, y) {
        const now = Date.now();
        trail.push({ x, y, hue: hue, time: now });
        if (trail.length > maxTrailLength) {
          trail.shift();
        }
        hue = (hue + 2) % 360;
        lastTrailTime = now;
      }

      function drawTrail() {
        trailCtx.clearRect(0, 0, trailCanvas.width, trailCanvas.height);

        if (trail.length < 2) return;

        const now = Date.now();

        // Remove old trail points
        trail.forEach((point, index) => {
          if (now - point.time > 10000) {
            // 10 seconds
            trail.splice(index, 1);
          }
        });

        for (let i = 1; i < trail.length; i++) {
          const prev = trail[i - 1];
          const curr = trail[i];
          const age = now - curr.time;
          const fadeProgress = Math.max(0, 1 - age / 10000); // Fade over 10 seconds
          const progress = (i / trail.length) * fadeProgress;

          if (progress > 0) {
            trailCtx.beginPath();
            trailCtx.moveTo(prev.x, prev.y);
            trailCtx.lineTo(curr.x, curr.y);

            trailCtx.strokeStyle = `hsla(${curr.hue}, 100%, 50%, ${progress})`;
            trailCtx.lineWidth = progress * 5;
            trailCtx.lineCap = "round";
            trailCtx.stroke();

            // Glow effect
            trailCtx.shadowBlur = 10;
            trailCtx.shadowColor = `hsla(${curr.hue}, 100%, 50%, ${progress * 0.5})`;
            trailCtx.stroke();
            trailCtx.shadowBlur = 0;
          }
        }
      }

      // Mouse/touch events for trail
      function handleMove(e) {
        const point = e.touches ? e.touches[0] : e;
        updateTrail(point.clientX, point.clientY);
      }

      document.addEventListener("mousemove", handleMove);
      document.addEventListener("touchmove", handleMove);

      // Double click/tap for floating emojis
      let lastTapTime = 0;

      function createFloatingEmoji(x, y) {
        const emoji = document.createElement("div");
        emoji.className = "floating-emoji";
        emoji.textContent =
          birthdayEmojis[Math.floor(Math.random() * birthdayEmojis.length)];
        emoji.style.left = x + "px";
        emoji.style.top = y + "px";
        document.body.appendChild(emoji);

        setTimeout(() => emoji.remove(), 3000);
      }

      document.addEventListener("dblclick", (e) => {
        createFloatingEmoji(e.clientX, e.clientY);
      });

      document.addEventListener("touchend", (e) => {
        const currentTime = new Date().getTime();
        const tapLength = currentTime - lastTapTime;
        if (tapLength < 500 && tapLength > 0) {
          const touch = e.changedTouches[0];
          createFloatingEmoji(touch.clientX, touch.clientY);
        }
        lastTapTime = currentTime;
      });

      // Device orientation for tilt control
      if (
        window.DeviceOrientationEvent &&
        typeof DeviceOrientationEvent.requestPermission !== "function"
      ) {
        // Only add listener if permission is not required (non-iOS) or already granted
        window.addEventListener("deviceorientation", (e) => {
          if (e.gamma !== null && e.beta !== null) {
            tiltX = e.gamma / 10; // Left/right tilt
            tiltY = e.beta / 10; // Front/back tilt

            // Limit values
            tiltX = Math.max(-5, Math.min(5, tiltX));
            tiltY = Math.max(-5, Math.min(5, tiltY));
          }
        });
      }

      // Fireworks on click
      document.addEventListener("click", (e) => {
        // Check if click is on a button or interactive element
        if (
          e.target.closest(".music-control") ||
          e.target.closest(".refresh-wishes") ||
          e.target.closest(".cake-container") ||
          e.target.tagName === "BUTTON"
        )
          return;

        // Check if click is on a balloon
        let clickedBalloon = false;
        balloons.forEach((balloon) => {
          if (!balloon.popped && balloon.checkClick(e.clientX, e.clientY)) {
            clickedBalloon = true;
          }
        });

        if (!clickedBalloon) {
          createFirework(e.clientX, e.clientY);
        }
      });

      function createFirework(x, y) {
        const firework = document.createElement("div");
        firework.className = "firework";
        firework.style.left = x + "px";
        firework.style.top = y + "px";

        const colors = [
          "#ff0000",
          "#00ff00",
          "#0000ff",
          "#ffff00",
          "#ff00ff",
          "#00ffff",
          "#ffa500",
          "#ff69b4",
        ];
        const particleCount = 30;

        for (let i = 0; i < particleCount; i++) {
          const particle = document.createElement("div");
          particle.className = "firework-particle";
          particle.style.backgroundColor =
            colors[Math.floor(Math.random() * colors.length)];

          const angle = (Math.PI * 2 * i) / particleCount;
          const velocity = 50 + Math.random() * 50;
          const tx = Math.cos(angle) * velocity;
          const ty = Math.sin(angle) * velocity;

          particle.style.transform = `translate(${tx}px, ${ty}px)`;
          particle.style.boxShadow = `0 0 6px ${particle.style.backgroundColor}`;

          firework.appendChild(particle);
        }

        document.body.appendChild(firework);

        setTimeout(() => {
          firework.remove();
        }, 1000);
      }

      // Animation loops
      function animateConfetti() {
        confettiCtx.clearRect(
          0,
          0,
          confettiCanvas.width,
          confettiCanvas.height,
        );
        confettiPieces.forEach((piece) => {
          piece.update();
          piece.draw();
        });
        requestAnimationFrame(animateConfetti);
      }

      function animateBalloons() {
        balloonCtx.clearRect(0, 0, balloonCanvas.width, balloonCanvas.height);
        balloons.forEach((balloon) => {
          balloon.update();
          balloon.draw();
        });
        requestAnimationFrame(animateBalloons);
      }

      function animateTrail() {
        drawTrail();
        requestAnimationFrame(animateTrail);
      }

      animateConfetti();
      animateBalloons();
      animateTrail();

      // Vibration (only on supported devices)
      if ("vibrate" in navigator) {
        navigator.vibrate([200, 100, 200, 100, 200]);
      }

      // Audio setup
      // Note: AudioContext auto-start warning is expected - audio requires user interaction
      let audioContext;
      let isPlaying = false;
      let musicInterval;

      function initAudio() {
        try {
          window.AudioContext =
            window.AudioContext || window.webkitAudioContext;
          audioContext = new AudioContext();
          return true;
        } catch (e) {
          console.log("Web Audio API not supported");
          return false;
        }
      }

      if (initAudio()) {
        document.querySelector(".music-control").classList.remove("hidden");
      }

      function playNote(frequency, duration) {
        if (!audioContext) return;

        const oscillator = audioContext.createOscillator();
        const gainNode = audioContext.createGain();

        oscillator.connect(gainNode);
        gainNode.connect(audioContext.destination);

        oscillator.frequency.value = frequency;
        oscillator.type = "sine";

        gainNode.gain.setValueAtTime(0.3, audioContext.currentTime);
        gainNode.gain.exponentialRampToValueAtTime(
          0.01,
          audioContext.currentTime + duration,
        );

        oscillator.start(audioContext.currentTime);
        oscillator.stop(audioContext.currentTime + duration);
      }

      const melody = [
        { note: 262, duration: 0.5 }, // C
        { note: 262, duration: 0.5 }, // C
        { note: 294, duration: 1 }, // D
        { note: 262, duration: 1 }, // C
        { note: 349, duration: 1 }, // F
        { note: 330, duration: 2 }, // E
        { note: 262, duration: 0.5 }, // C
        { note: 262, duration: 0.5 }, // C
        { note: 294, duration: 1 }, // D
        { note: 262, duration: 1 }, // C
        { note: 392, duration: 1 }, // G
        { note: 349, duration: 2 }, // F
      ];

      function playMelody() {
        let noteIndex = 0;
        musicInterval = setInterval(() => {
          if (noteIndex < melody.length) {
            playNote(melody[noteIndex].note, melody[noteIndex].duration);
            noteIndex++;
          } else {
            noteIndex = 0;
          }
        }, 500);
      }

      function toggleMusic() {
        if (!audioContext) return;

        if (audioContext.state === "suspended") {
          audioContext.resume();
        }

        if (isPlaying) {
          clearInterval(musicInterval);
          document.getElementById("music-status").textContent = "Play Music";
        } else {
          playMelody();
          document.getElementById("music-status").textContent = "Stop Music";
        }
        isPlaying = !isPlaying;
      }

      // Resize handler
      window.addEventListener("resize", () => {
        confettiCanvas.width = window.innerWidth;
        confettiCanvas.height = window.innerHeight;
        trailCanvas.width = window.innerWidth;
        trailCanvas.height = window.innerHeight;
        balloonCanvas.width = window.innerWidth;
        balloonCanvas.height = window.innerHeight;
      });
    </script>
  </body>
</html>
