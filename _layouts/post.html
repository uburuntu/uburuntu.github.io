<!DOCTYPE html>
<html lang="en">
<head>
    {% include head.html %}
</head>
<body class="is-loading">

<div id="wrapper" class="fade-in">
    <header id="header">
        <a href="{{ "/" | absolute_url }}" class="logo">{{ site.title }}</a>
    </header>

    <nav id="nav">
        {% include nav.html %}
    </nav>

    <div id="main">
        <section class="post">
            <header class="major">
                <span class="date">{{ page.date | date_to_string }}</span>
                <h1>{{ page.title }}</h1>
                <p>{{ page.excerpt }}</p>
            </header>
            {% if page.image %}
            <div class="image main"><img src="{{ page.image }}" alt="{{ page.title }}"></div>
            {% endif %}
            <hr>
            {{ content }}
        </section>
    </div>

    {% include foot.html %}
</div>

{% include scripts-main.html %}

</body>
</html>
