# Site
title:              Ramzan Bekbulatov
bio:                'Software Engineer | Team Lead'
description:        "Personal site"
locale:             en_US
baseurl: "" # the subpath of your site, e.g. /blog
url: "https://rmbk.me" # the base hostname & protocol for your site

# Comments
disqus_shortname:   default

# Social
analytics-id:       UA-123345095-2
linkedin:           rmbk
vk:                 rm_bk
telegram:           rm_bk
instagram:          rm_bk
github:             uburuntu

# change this to your email to receive free emails for your contact submissions via Slapform.com
email:              bekbulatov.ramzan@ya.ru

# Other
background_image:   /images/bg.jpg
# Tip: The color palette and other styles can be configured in /_sass/lib/_vars.scss

defaults:
- scope:
    path: ''
    type: posts
  values:
    permalink: "/blog/:title/"
    layout: post
    author:

# Jekyll
permalink:          /blog/:title/
markdown:           kramdown
highlighter:        rouge
kramdown:
  auto_ids:         true
  footnote_nr:      1
  entity_output:    as_char
  toc_levels:       1..6
  enable_coderay:   false
mathjax:            true
sass:
  sass_dir:         _sass
  style:            compressed

# Gems
plugins:
  - jekyll-mentions
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-gist
  - jemoji

paginate: 6
paginate_path: "/blog/page:num/"

jekyll-mentions:
    base_url: https://github.com

# Exclude list
exclude: [README.md, Gemfile, Gemfile.lock, node_modules, gulpfile.js, package.json, _site, src, vendor, CNAME, LICENSE, Rakefile, old]
