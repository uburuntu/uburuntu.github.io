# =============================================================================
# Site Configuration
# =============================================================================
title: Ramzan Bekbulatov
description: Personal site
url: https://rmbk.me
baseurl: ""
repository: uburuntu/uburuntu.github.io
locale: en_US

# =============================================================================
# Social Links (used in nav.html)
# =============================================================================
social_links:
  github: uburuntu
  linkedin: rmbk
  twitter: real_rmbk
  telegram: rm_bk
  instagram: rm_bk
  email: ramzan.bekbulatov@pm.me

# =============================================================================
# SEO & Open Graph (jekyll-seo-tag)
# =============================================================================
author:
  name: Ramzan Bekbulatov
  twitter: real_rmbk

twitter:
  username: real_rmbk
  card: summary

social:
  name: Ramzan Bekbulatov
  links:
    - https://github.com/uburuntu
    - https://linkedin.com/in/rmbk
    - https://twitter.com/real_rmbk

# =============================================================================
# Theme & Assets
# =============================================================================
background_image: /images/bg.jpg

sass:
  sass_dir: _sass
  style: compressed
  quiet_deps: true

# =============================================================================
# Jekyll Settings
# =============================================================================
permalink: /blog/:title/
markdown: kramdown

kramdown:
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6

# =============================================================================
# Plugins
# =============================================================================
plugins:
  - jekyll-sitemap
  - jekyll-feed
  - jekyll-seo-tag
  - jemoji

# =============================================================================
# Content Defaults
# =============================================================================
# Posts can define og:image in front matter:
#   ---
#   image: /images/my-post-image.jpg
#   ---
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post

  # Standalone HTML pages in pages/ folder
  - scope:
      path: "pages"
    values:
      layout: null
      sitemap: false

# =============================================================================
# Build Exclusions
# =============================================================================
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - docker-compose.yml
  - vendor
  - node_modules
  - cv/
